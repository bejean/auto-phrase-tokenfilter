# Elasticsearch classic plugin descriptor file
# The plugin zip contains, at its root, this file and the jars of the plugin and its dependencies.
# https://www.elastic.co/docs/extend/elasticsearch/plugin-descriptor-file-classic
#
# 'description': simple summary of the plugin
description=${project.description}
#
# 'version': plugin's version
version=${project.version}
#
# 'name': the plugin name
name=autophrasing
#
# 'classname': the name of the class to load, fully-qualified
classname=org.elasticsearch.plugin.analysis.autophrasing.AnalysisAutoPhrasingPlugin
#
# 'java.version': version of java the code is built against
java.version=${maven.compiler.release}
#
# 'elasticsearch.version': version of elasticsearch compiled against;
# a classic plugin must be rebuilt for each elasticsearch version
elasticsearch.version=${elasticsearch.version}
