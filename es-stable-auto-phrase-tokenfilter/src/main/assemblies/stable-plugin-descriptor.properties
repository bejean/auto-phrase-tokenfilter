# Elasticsearch stable plugin descriptor file
# The plugin zip contains, at its root, this file and the jars of the plugin and its dependencies.
# named_components.json maps the component names to their classes (generated by elasticsearch-plugin install when absent).
# https://www.elastic.co/docs/extend/elasticsearch/plugin-descriptor-file-stable
#
# 'description': simple summary of the plugin
description=${project.description}
#
# 'version': plugin's version
version=${project.version}
#
# 'name': the plugin name
name=autophrasing-stable
#
# 'java.version': version of java the code is built against
java.version=${maven.compiler.release}
#
# 'elasticsearch.version': version of the plugin API compiled against;
# a stable plugin only has to match the major version of elasticsearch
elasticsearch.version=${elasticsearch.version}
